# Disposable Postgres for the *_integration_test.go suite (TestRBACMigrations...,
# TestPostgresUserRepository..., etc.) — every one of them skips unless
# TEST_DATABASE_URL or DATABASE_URL is set, so this container is opt-in and
# never touched by `go test ./...` on its own.
#
# It intentionally has no volume: every `docker compose -f docker-compose.test.yml
# up` (re)creation starts from an empty database, and `down` leaves nothing
# behind. Point tests at it on a port distinct from the dev database
# (POSTGRES_PORT in .env) so a test run can never land on real data:
#
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL="postgres://test:test@127.0.0.1:5434/booking_test?sslmode=disable"
#   go test ./...
#   docker compose -f docker-compose.test.yml down
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: booking_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d booking_test"]
      interval: 2s
      timeout: 2s
      retries: 15
